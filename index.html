<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春賞關東．花樣五日遊</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Long+Cang&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap');
        
        :root {
            --paper: #FFFCF6;
            --ink: #3E3A39;
            --coral: #F2A497;
            --yellow: #F6D27A;
            --blue: #A8D3E6;
            --green: #B9DAA5;
            --shadow: 3px 3px 0px #3E3A39;
            --border: 3px solid #3E3A39;
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--ink);
        }

        body {
            background-color: var(--paper);
            background-image: radial-gradient(#e5e0d8 1px, transparent 1px);
            background-size: 20px 20px;
            padding-bottom: 80px;
        }

        /* 頂端固定選單 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--paper);
            border-bottom: var(--border);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .nav-logo {
            font-weight: 700;
            background: var(--coral);
            padding: 5px 12px;
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: 2px 2px 0px var(--ink);
            font-size: 14px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: #fff;
            border: var(--border);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--ink);
            text-decoration: none;
            transition: transform 0.1s;
        }

        .nav-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* 主容器 */
        .container {
            max-width: 600px;
            margin: 80px auto 20px auto;
            padding: 0 15px;
        }

        /* 通用卡片 */
        .card {
            background: #fff;
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        /* 首頁 Banner */
        .hero-banner {
            text-align: center;
            background: var(--blue);
        }

        .hero-title {
            font-size: 24px;
            font-weight: 700;
            margin: 15px 0 10px 0;
        }

        .tag-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .tag {
            background: #fff;
            border: 2px solid var(--ink);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        /* 倒數計時器 */
        .countdown-card {
            background: var(--yellow);
            text-align: center;
        }

        /* 航班卡片 */
        .flight-card {
            background: var(--paper);
            border: var(--border);
            border-radius: 15px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 日期切換按鈕 */
        .day-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .day-tab {
            background: #fff;
            border: var(--border);
            padding: 8px 14px;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 2px 2px 0px var(--ink);
            transition: all 0.2s;
        }

        .day-tab.active {
            background: var(--coral);
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* 時間軸行程 */
        .timeline-item {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .timeline-item:not(:last-child):after {
            content: '';
            position: absolute;
            left: 14px;
            top: 30px;
            width: 3px;
            height: calc(100% + 10px);
            background: var(--ink);
            z-index: 1;
        }

        .timeline-dot {
            width: 31px;
            height: 31px;
            background: var(--green);
            border: var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            z-index: 2;
            flex-shrink: 0;
            box-shadow: 2px 2px 0px var(--ink);
        }

        .timeline-content {
            background: #fff;
            border: var(--border);
            border-radius: 15px;
            padding: 12px;
            flex-grow: 1;
            box-shadow: 2px 2px 0px var(--ink);
        }

        .badge-must {
            background: var(--coral);
            color: var(--ink);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 8px;
            border: 2px solid var(--ink);
            font-weight: 700;
            margin-left: 6px;
        }

        .badge-transport {
            background: var(--blue);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 8px;
            border: 2px solid var(--ink);
            font-weight: 700;
            display: inline-block;
            margin-bottom: 5px;
        }

        /* 清單樣式 */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 2px dashed #e0dacd;
        }

        .checklist-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--coral);
            cursor: pointer;
        }

        /* 動畫開關與設定 */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-logo">🌸 關東花旅</div>
        <div class="nav-links">
            <a href="#home" class="nav-btn">首頁</a>
            <a href="#flight" class="nav-btn">航班</a>
            <a href="#itinerary" class="nav-btn">行程</a>
            <a href="#checklist" class="nav-btn">隨身清單</a>
        </div>
    </header>

    <div class="container">
        <!-- 首頁 Banner -->
        <div id="home" class="card hero-banner">
            <!-- 手繪風格 SVG 插圖 -->
            <svg viewBox="0 0 400 200" width="100%" height="auto" style="border: 3px solid #3E3A39; border-radius: 15px; background: #fff;">
                <path d="M0,150 Q100,120 200,150 T400,140 L400,200 L0,200 Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3"/>
                <polygon points="200,60 260,150 140,150" fill="#fff" stroke="#3E3A39" stroke-width="3"/>
                <path d="M185,85 Q200,75 215,85 L225,100 Q200,95 175,100 Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3"/>
                <circle cx="80" cy="50" r="20" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
                <circle cx="320" cy="70" r="15" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/>
            </svg>
            <div style="margin-top: 10px; font-size: 12px; font-weight: 700;">ATE集團福委會 × 山富旅遊</div>
            <h1 class="hero-title">春賞關東．花樣五日遊</h1>
            <div class="tag-group">
                <span class="tag">粉蝶花海</span>
                <span class="tag">夢幻紫藤</span>
                <span class="tag">雙富士芝櫻</span>
            </div>
        </div>

        <!-- 倒數計時器 -->
        <div class="card countdown-card">
            <h3 style="font-size: 16px; margin-bottom: 5px;">⏳ 距離出發還有</h3>
            <div id="countdown" style="font-size: 20px; font-weight: 700;">計算中...</div>
        </div>

        <!-- 航班資訊 -->
        <div id="flight" class="card">
            <h2>✈️ 參考航班資訊</h2>
            <div class="flight-card">
                去程：CI100 08:50 (桃園 TPE) ➔ 13:15 (成田 NRT)
            </div>
            <div class="flight-card">
                回程：CI101 14:30 (成田 NRT) ➔ 17:15 (桃園 TPE)
            </div>
        </div>

        <!-- 每日行程 -->
        <div id="itinerary" class="card">
            <h2>📅 每日行程導覽</h2>
            <div class="day-tabs" id="dayTabs">
                <div class="day-tab active" onclick="switchDay(1)">Day 1</div>
                <div class="day-tab" onclick="switchDay(2)">Day 2</div>
                <div class="day-tab" onclick="switchDay(3)">Day 3</div>
                <div class="day-tab" onclick="switchDay(4)">Day 4</div>
                <div class="day-tab" onclick="switchDay(5)">Day 5</div>
            </div>

            <div id="dayContent">
                <!-- 內容會由 JS 動態載入 -->
            </div>
        </div>

        <!-- 隨身清單 -->
        <div id="checklist" class="card" style="background: var(--yellow);">
            <h2>🎒 旅人隨身清單</h2>
            <p style="font-size: 12px; margin-bottom: 10px;">勾選項目會自動儲存</p>
            <div id="checklistContainer">
                <div class="checklist-item"><input type="checkbox"> 護照與日幣現金 / 信用卡</div>
                <div class="checklist-item"><input type="checkbox"> 網卡 / 漫遊設定</div>
                <div class="checklist-item"><input type="checkbox"> 常用個人常備藥品</div>
                <div class="checklist-item"><input type="checkbox"> 保暖外套與好走的布鞋</div>
            </div>
        </div>
    </div>

    <script>
        const itineraryData = {
            1: [
                { time: "08:50", title: "桃園機場集合出發", tag: "航班", desc: "搭乘豪華客機直飛日本成田機場。特別安排每人一份當季迎賓水果。" },
                { time: "13:15", title: "抵達東京成田機場", tag: "入境", desc: "辦理入境手續後展開精彩日本之旅。" },
                { time: "15:30", title: "水戶 偕樂園", tag: "景點", desc: "日本三大名園之一，營業至晚上 7:00。<span class='badge-must'>★ 必去</span>" },
                { time: "18:30", title: "水戶 APA 飯店或同級", tag: "住宿", desc: "晚餐享用燒肉或居酒屋料理。" }
            ],
            2: [
                { time: "09:00", title: "日立常陸海濱公園", tag: "景點", desc: "春季主打約 530 萬株粉蝶花（喜林草）蔚藍花海。<span class='badge-must'>★ 必去</span>" },
                { time: "13:00", title: "足利紫藤花卉公園", tag: "景點", desc: "CNN 評選世界十大夢幻旅遊景點，賞紫藤花物語。" },
                { time: "18:00", title: "入住溫泉飯店", tag: "住宿", desc: "享用飯店內用迎賓料理與溫泉放鬆。" }
            ],
            3: [
                { time: "09:00", title: "大石公園", tag: "景點", desc: "河口湖畔眺望富士山絕景與花街道。<span class='badge-must'>★ 必去</span>" },
                { time: "11:00", title: "河口湖富士山纜車", tag: "交通", desc: "搭乘纜車登上天上山公園全景飽覽富士山。" },
                { time: "13:30", title: "山中湖白鳥湖號", tag: "遊船", desc: "搭乘水戶岡銳治設計的天鵝造型遊覽船。" },
                { time: "15:30", title: "忍野八海", tag: "景點", desc: "日本百選名水，富士山融雪湧出的八座清澈泉池。" }
            ],
            4: [
                { time: "09:00", title: "富士芝櫻祭", tag: "景點", desc: "關東最大規模約 80 萬株粉紅芝櫻與雙富士絕景。<span class='badge-must'>★ 必去</span>" },
                { time: "13:00", title: "免稅店購物", tag: "購物", desc: "停靠免稅店選購伴手禮。" },
                { time: "15:00", title: "東京市區自由逛街", tag: "自由行", desc: "淺草區自由逛街購物與品嚐在地美食。" },
                { time: "19:00", title: "淺草 Vessel 飯店或同級", tag: "住宿", desc: "入住淺草區，鄰近雷門商圈。" }
            ],
            5: [
                { time: "09:00", title: "飯店自由活動", tag: "自由行", desc: "享受最後的東京晨光與隨性漫步。" },
                { time: "12:00", title: "前往成田機場搭機返台", tag: "航班", desc: "搭乘 CI101 班機（14:30起飛）返回桃園機場，結束愉快旅程。" }
            ]
        };

        function switchDay(day) {
            document.querySelectorAll('.day-tab').forEach((tab, idx) => {
                tab.classList.toggle('active', idx + 1 === day);
            });

            const container = document.getElementById('dayContent');
            container.innerHTML = itineraryData[day].map(item => `
                <div class="timeline-item">
                    <div class="timeline-dot">${item.time}</div>
                    <div class="timeline-content">
                        <span class="badge-transport">${item.tag}</span>
                        <strong style="font-size: 15px;">${item.title}</strong>
                        <p style="margin-top: 6px; font-size: 13px; line-height: 1.4;">${item.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        // 初始化顯示 Day 1
        switchDay(1);

        // 倒數計時器
        function updateCountdown() {
            const target = new Date('2027-04-20T08:50:00');
            const now = new Date();
            const diff = target - now;
            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                document.getElementById('countdown').innerText = `${days} 天 ${hours} 小時`;
            } else {
                document.getElementById('countdown').innerText = '旅程已出發！';
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
